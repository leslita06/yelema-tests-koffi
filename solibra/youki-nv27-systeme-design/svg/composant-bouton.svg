<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" font-family="'Noto Sans','DejaVu Sans',Arial,sans-serif"><title>Composant bouton, tous les états</title><rect width="900" height="520" fill="#FFFFFF"/><rect width="900" height="26" fill="#27282C"/><rect width="6" height="26" fill="#CA0030"/><text x="16" y="17.5" font-size="11" font-weight="700" fill="#FFFFFF">FICTIF · scénario de test « Youki, nouvelle vague 2027 » · couleurs relevées sur solibra.ci, pas une charte officielle reçue</text><text x="24" y="62" font-size="18" font-weight="700" fill="#27282C" text-anchor="start">Bouton · 3 variantes × 6 états</text><text x="24" y="84" font-size="12" font-weight="400" fill="#4F4F4F" text-anchor="start">Hauteur 48 px (cible tactile ≥ 24 × 24 px WCAG 2.2 critère 2.5.8, visée 44 × 44 px critère 2.5.5). Arrondi 10 px.</text><text x="170" y="122" font-size="11" font-weight="700" fill="#4F4F4F" text-anchor="middle">Au repos</text><text x="290" y="122" font-size="11" font-weight="700" fill="#4F4F4F" text-anchor="middle">Survolé</text><text x="410" y="122" font-size="11" font-weight="700" fill="#4F4F4F" text-anchor="middle">Pressé</text><text x="530" y="122" font-size="11" font-weight="700" fill="#4F4F4F" text-anchor="middle">Désactivé</text><text x="650" y="122" font-size="11" font-weight="700" fill="#4F4F4F" text-anchor="middle">En cours</text><text x="770" y="122" font-size="11" font-weight="700" fill="#4F4F4F" text-anchor="middle">En erreur</text><text x="24" y="170" font-size="13" font-weight="700" fill="#27282C" text-anchor="start">Principal</text><rect x="116" y="140" width="108" height="48" rx="10" fill="#047034"/><text x="170.0" y="169" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Commander</text><rect x="236" y="140" width="108" height="48" rx="10" fill="#035125"/><text x="290.0" y="169" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Commander</text><rect x="356" y="140" width="108" height="48" rx="10" fill="#02411E"/><text x="410.0" y="169" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Commander</text><rect x="352" y="136" width="116" height="56" rx="13" fill="none" stroke="#27282C" stroke-width="3" stroke-dasharray="0"/><rect x="476" y="140" width="108" height="48" rx="10" fill="#EDEDED"/><text x="530.0" y="169" font-size="12" font-weight="700" fill="#7C7E84" text-anchor="middle">Commander</text><rect x="596" y="140" width="108" height="48" rx="10" fill="#047034"/><g transform="translate(610,155) scale(0.75)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1-9 9"/></g><text x="634" y="169" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="start">Envoi…</text><rect x="716" y="140" width="108" height="48" rx="10" fill="#047034"/><text x="770.0" y="169" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">Commander</text><g transform="translate(716,194) scale(0.5833333333333334)" fill="none" stroke="#CA0030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></g><text x="734" y="205" font-size="10" font-weight="700" fill="#CA0030" text-anchor="start">Échec, réessayer</text><text x="24" y="280" font-size="13" font-weight="700" fill="#27282C" text-anchor="start">Secondaire</text><rect x="117" y="251" width="106" height="46" rx="10" fill="#FFFFFF" stroke="#047034" stroke-width="2"/><text x="170.0" y="279" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Voir gamme</text><rect x="237" y="251" width="106" height="46" rx="10" fill="#EBFEF4" stroke="#047034" stroke-width="2"/><text x="290.0" y="279" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Voir gamme</text><rect x="357" y="251" width="106" height="46" rx="10" fill="#D8FEE8" stroke="#047034" stroke-width="2"/><text x="410.0" y="279" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Voir gamme</text><rect x="352" y="246" width="116" height="56" rx="13" fill="none" stroke="#27282C" stroke-width="3" stroke-dasharray="0"/><rect x="477" y="251" width="106" height="46" rx="10" fill="#FFFFFF" stroke="#7C7E84" stroke-width="2"/><text x="530.0" y="279" font-size="12" font-weight="700" fill="#7C7E84" text-anchor="middle">Voir gamme</text><rect x="597" y="251" width="106" height="46" rx="10" fill="#FFFFFF" stroke="#047034" stroke-width="2"/><g transform="translate(610,265) scale(0.75)" fill="none" stroke="#047034" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1-9 9"/></g><text x="634" y="279" font-size="12" font-weight="700" fill="#047034" text-anchor="start">Envoi…</text><rect x="717" y="251" width="106" height="46" rx="10" fill="#FFFFFF" stroke="#047034" stroke-width="2"/><text x="770.0" y="279" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Voir gamme</text><g transform="translate(716,304) scale(0.5833333333333334)" fill="none" stroke="#CA0030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></g><text x="734" y="315" font-size="10" font-weight="700" fill="#CA0030" text-anchor="start">Échec, réessayer</text><text x="24" y="390" font-size="13" font-weight="700" fill="#27282C" text-anchor="start">Texte</text><text text-decoration="underline" x="170.0" y="389" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Annuler</text><rect x="236" y="360" width="108" height="48" rx="10" fill="#EBFEF4"/><text text-decoration="underline" x="290.0" y="389" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Annuler</text><rect x="356" y="360" width="108" height="48" rx="10" fill="#D8FEE8"/><text text-decoration="underline" x="410.0" y="389" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Annuler</text><rect x="352" y="356" width="116" height="56" rx="13" fill="none" stroke="#27282C" stroke-width="3" stroke-dasharray="0"/><text x="530.0" y="389" font-size="12" font-weight="700" fill="#7C7E84" text-anchor="middle">Annuler</text><g transform="translate(610,375) scale(0.75)" fill="none" stroke="#047034" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 1-9 9"/></g><text x="634" y="389" font-size="12" font-weight="700" fill="#047034" text-anchor="start">Envoi…</text><text text-decoration="underline" x="770.0" y="389" font-size="12" font-weight="700" fill="#047034" text-anchor="middle">Annuler</text><g transform="translate(716,414) scale(0.5833333333333334)" fill="none" stroke="#CA0030" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 20h19z"/><path d="M12 10v4.5"/><path d="M12 17.5v.01"/></g><text x="734" y="425" font-size="10" font-weight="700" fill="#CA0030" text-anchor="start">Échec, réessayer</text><text x="24" y="486" font-size="11" font-weight="400" fill="#4F4F4F" text-anchor="start">Pressé = contour de focus 3 px noir Solibra (visible au clavier). En cours : bouton bloqué, libellé « Envoi… », pas de second envoi possible.</text><text x="24" y="504" font-size="11" font-weight="400" fill="#4F4F4F" text-anchor="start">En erreur : le bouton reste actif, le message (icône + mot) dit quoi faire. Texte blanc sur vert #047034 : contraste 6,23:1 (calculé, WCAG AA 4,5:1).</text></svg>