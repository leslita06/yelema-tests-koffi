name: maj-tdb
on:
  push:
    paths: ['.github/workflows/maj-tdb.yml']
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSfL -o /tmp/t.tgz https://d2ol7oe51mr4n9.cloudfront.net/user_3CLiuDaqihMgfiUGQ0KFfywxTTr/b363e964-2f3c-40b4-83b4-8a0a32ddad68.gz
          echo '57a0ceac5a5627ddc8eaf8c8135a47f4151aa92fee89707585f64adf5c17aa29  /tmp/t.tgz' | sha256sum -c -
          tar xzf /tmp/t.tgz
          git rm -q .github/workflows/maj-tdb.yml
          git config user.name koffi && git config user.email koffi@users.noreply.github.com
          git add -A tableau-de-bord
          git commit -m 'Tableau de bord Koffi, mise a jour du 27/10/2026 17:10'
          git push
