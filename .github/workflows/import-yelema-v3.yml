name: import-yelema-v3
on:
  push:
    paths: ['.github/workflows/import-yelema-v3.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recuperer et extraire
        run: |
          curl -sfL 'https://d2ol7oe51mr4n9.cloudfront.net/user_3CLiuDaqihMgfiUGQ0KFfywxTTr/d830621c-8dbb-488a-b39f-cbae1f3c3353.zip' -o /tmp/site.zip
          test $(stat -c %s /tmp/site.zip) -eq 341528
          mkdir -p yelema-site-v3
          unzip -o /tmp/site.zip -d yelema-site-v3
          git rm -q --cached .github/workflows/import-yelema-v3.yml
          rm .github/workflows/import-yelema-v3.yml
      - name: Commit
        run: |
          git config user.name 'Koffi (Yelema)'
          git config user.email 'koffi.mstudio@agentmail.to'
          git add -A
          git commit -m 'Page Yelema v3 (preversion non indexee) et retrait de l action'
          git push
